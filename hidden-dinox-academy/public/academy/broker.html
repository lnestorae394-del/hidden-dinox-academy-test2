<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Hidden Dinox Academy — подключение брокера</title>
<link rel="icon" href="assets/brand/hd-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/auth.css?v=20261026-2">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="bg" aria-hidden="true"><canvas id="particles"></canvas></div>
<div class="app" id="app">
  <header>
    <a class="brand" href="/" aria-label="Hidden Dinox Academy">
      <img src="assets/brand/hd-logo.png" alt="HiddenDinox" width="386" height="288">
      <div class="wordmark">HIDDEN DINOX<span>ACADEMY</span></div>
    </a>
    <div class="ac-head">
      <div class="langs" role="group" aria-label="Language"><span class="pill" aria-hidden="true"></span>
        <button type="button" data-lang="ru" aria-pressed="true">RU</button><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="ua" aria-pressed="false">UA</button></div>
    </div>
  </header>
  <main id="main" aria-busy="true"></main>
</div>
<div class="modal" id="howModal" role="dialog" aria-modal="true" aria-labelledby="howTitle"><div class="backdrop" data-close></div>
  <div class="sheet"><div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="howTitle" data-t="howTitle"></h2><button type="button" class="close" data-close data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <ol class="steps">
      <li><div><p data-t="step1"></p><div class="shot" data-img="img/id1.jpg"><div><code>img/id1.jpg</code><span data-t="shotNote"></span></div></div></div></li>
      <li><div><p data-t="step2"></p><div class="shot" data-img="img/id2.jpg"><div><code>img/id2.jpg</code><span data-t="shotNote"></span></div></div></div></li>
      <li><div><p data-t="step3"></p></div></li>
    </ol></div></div>
<div class="modal" id="oldModal" role="dialog" aria-modal="true" aria-labelledby="oldTitle"><div class="backdrop" data-close></div>
  <div class="sheet info"><div class="grab" aria-hidden="true"></div>
    <div class="sheet-head"><h2 id="oldTitle" data-t="oldTitle"></h2><button type="button" class="close" data-close data-ta="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <p data-t="old1"></p><p data-t="old2"></p><p class="note" data-t="oldNote"></p>
    <div class="stack"><button type="button" class="btn btn-primary" data-partner><span class="label" data-t="oldBtn"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg></button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/i18n-auth.js?v=20261026-2"></script>
<script src="js/config.js?v=20261026-2"></script>
<script src="js/api.js?v=20261026-2"></script>
<script src="js/ui.js?v=20261026-2"></script>
<script type="module" src="js/firebase.js?v=20261026-2" onerror="window.__hdFbReject&&window.__hdFbReject({code:'NETWORK'})"></script>
<script src="js/pages/broker.js?v=20261026-2"></script>
</body>
</html>
